<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Answer Evaluation System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1117;
            --ink-light: #4a5568;
            --ink-muted: #718096;
            --surface: #ffffff;
            --surface-2: #f7f8fc;
            --surface-3: #edf0f7;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-light: #dbeafe;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --border: #e2e8f0;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface-2);
            color: var(--ink);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.6;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--surface) !important;
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 1px 0 var(--border);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--ink) !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
        }
        .brand-sub {
            font-size: 0.72rem;
            font-weight: 400;
            color: var(--ink-muted);
            display: block;
            line-height: 1;
            margin-top: 1px;
        }
        .nav-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--ink-light) !important;
            padding: 0.4rem 1rem !important;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--accent) !important;
            background: var(--accent-light);
        }

        /* ── Page wrapper ── */
        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* ── Page header ── */
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 0.3rem;
        }
        .page-header p {
            color: var(--ink-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-header-strip {
            background: var(--ink);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header-strip.accent { background: var(--accent); }
        .card-header-strip.success { background: var(--success); }
        .card-body-pad { padding: 1.5rem; }

        /* ── Buttons ── */
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.55rem 1.4rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--ink-light);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* ── Form elements ── */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.4rem;
        }
        .form-control, .form-select {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            padding: 0.55rem 0.9rem;
            color: var(--ink);
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
            outline: none;
        }
        textarea.form-control { resize: vertical; min-height: 90px; font-family: 'DM Mono', monospace; font-size: 0.85rem; }

        /* ── Tags input for keywords ── */
        .tags-wrap {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.7rem;
            min-height: 44px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            cursor: text;
            background: var(--surface);
            transition: border-color 0.15s;
        }
        .tags-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .tag {
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 10px 2px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tag-remove { cursor: pointer; font-size: 0.85rem; opacity: 0.6; }
        .tag-remove:hover { opacity: 1; }
        .tag-input {
            border: none;
            outline: none;
            font-size: 0.88rem;
            min-width: 120px;
            flex: 1;
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
        }

        /* ── Section/Question blocks ── */
        .q-block {
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1.2rem;
        }
        .q-block-header {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .q-block-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .q-mark-badge {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .q-block-body { padding: 1.2rem; }

        /* ── Toggle switch ── */
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--ink-light);
        }
        .form-switch .form-check-input {
            width: 2.5em;
            height: 1.25em;
            cursor: pointer;
        }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

        /* ── Loading overlay ── */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,17,23,0.65);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .loading-overlay.active { display: flex; }
        .loading-box {
            background: white;
            border-radius: 16px;
            padding: 2.5rem 3rem;
            text-align: center;
            box-shadow: var(--shadow-md);
        }
        .spinner-ring {
            width: 48px;
            height: 48px;
            border: 4px solid var(--surface-3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.3rem; }
        .loading-sub { font-size: 0.85rem; color: var(--ink-muted); }

        /* ── Toast alerts ── */
        .toast-stack {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.85rem 1.2rem;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.2s ease;
            min-width: 280px;
        }
        .toast-item.success { border-left: 3px solid var(--success); }
        .toast-item.danger { border-left: 3px solid var(--danger); }
        .toast-item.info { border-left: 3px solid var(--accent); }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── Step indicator ── */
        .steps {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .step {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-muted);
            border-right: 1px solid var(--border);
            position: relative;
        }
        .step:last-child { border-right: none; }
        .step.active { background: var(--accent-light); color: var(--accent); }
        .step.done { background: var(--success-light); color: var(--success); }
        .step-num {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--border);
            color: var(--ink-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 700;
            margin: 0 auto 0.3rem;
        }
        .step.active .step-num { background: var(--accent); color: white; }
        .step.done .step-num { background: var(--success); color: white; }

        /* ── Results ── */
        .score-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
        }
        .score-big {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            color: var(--ink);
        }
        .score-label {
            font-size: 0.8rem;
            color: var(--ink-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 0.4rem;
        }
        .score-bar-wrap {
            background: var(--surface-3);
            border-radius: 99px;
            height: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .score-bar {
            height: 100%;
            border-radius: 99px;
            background: var(--accent);
            transition: width 0.8s ease;
        }
        .score-bar.good { background: var(--success); }
        .score-bar.mid { background: var(--warning); }
        .score-bar.low { background: var(--danger); }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .result-row:last-child { border-bottom: none; }
        .result-mark {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .badge-attempted { background: var(--success-light); color: var(--success); padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .badge-skipped { background: var(--surface-3); color: var(--ink-muted); padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }

        /* ── Misc ── */
        .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
        .muted { color: var(--ink-muted); font-size: 0.85rem; }
        .mono { font-family: 'DM Mono', monospace; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
        <div class="spinner-ring"></div>
        <div class="loading-title" id="loadingTitle">Processing...</div>
        <div class="loading-sub" id="loadingSub">Please wait</div>
    </div>
</div>

<!-- Toast Stack -->
<div class="toast-stack" id="toastStack"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <div class="brand-icon"><i class="fas fa-pen-nib"></i></div>
            <div>
                Automated Evaluation System
                <span class="brand-sub">OCR &amp; LLMs</span>
            </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul class="navbar-nav gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="fas fa-home me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/create' in request.path %}active{% endif %}" href="/create-exam">
                        <i class="fas fa-plus-circle me-1"></i> Create Exam
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/evaluate' in request.path %}active{% endif %}" href="/evaluate">
                        <i class="fas fa-check-circle me-1"></i> Evaluate
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function showLoading(title='Processing...', sub='Please wait') {
    document.getElementById('loadingTitle').textContent = title;
    document.getElementById('loadingSub').textContent = sub;
    document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}
function showToast(msg, type='info') {
    const icons = { success: 'fa-check-circle', danger: 'fa-exclamation-circle', info: 'fa-info-circle' };
    const colors = { success: '#059669', danger: '#dc2626', info: '#2563eb' };
    const t = document.createElement('div');
    t.className = `toast-item ${type}`;
    t.innerHTML = `<i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info}"></i>${msg}`;
    document.getElementById('toastStack').appendChild(t);
    setTimeout(() => t.remove(), 4000);
}

// Tags input helper
function initTagsInput(wrapId, hiddenId) {
    const wrap = document.getElementById(wrapId);
    const hidden = document.getElementById(hiddenId);
    if (!wrap || !hidden) return;

    const input = wrap.querySelector('.tag-input');
    let tags = [];

    function render() {
        wrap.querySelectorAll('.tag').forEach(t => t.remove());
        tags.forEach((tag, i) => {
            const el = document.createElement('span');
            el.className = 'tag';
            el.innerHTML = `${tag}<span class="tag-remove" data-i="${i}">×</span>`;
            wrap.insertBefore(el, input);
        });
        hidden.value = JSON.stringify(tags);
    }

    wrap.addEventListener('click', () => input.focus());

    input.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
            e.preventDefault();
            const val = input.value.trim().replace(/,$/, '');
            if (val && !tags.includes(val)) { tags.push(val); render(); }
            input.value = '';
        }
        if (e.key === 'Backspace' && !input.value && tags.length) {
            tags.pop(); render();
        }
    });

    wrap.addEventListener('click', e => {
        if (e.target.classList.contains('tag-remove')) {
            tags.splice(parseInt(e.target.dataset.i), 1);
            render();
        }
    });
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
